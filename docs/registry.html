<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mechanical register</title>
<style>
:root{--bg:#f6f5f2;--panel:#fff;--ink:#1d1d1f;--mute:#6b6b70;--line:#e3e1dc;--slot:#ecebe7;--accent:#2f7d4f;--chip:#fff;--shadow:0 1px 2px rgba(0,0,0,.06),0 4px 16px rgba(0,0,0,.05)}
@media (prefers-color-scheme:dark){:root{--bg:#141517;--panel:#1d1f22;--ink:#ececee;--mute:#9a9ca3;--line:#2c2f33;--slot:#26292d;--accent:#5fbf86;--chip:#1d1f22;--shadow:0 1px 2px rgba(0,0,0,.4)}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
img{image-rendering:pixelated;image-rendering:crisp-edges}
a{color:inherit}
header{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:14px 16px 10px}
.top{display:flex;gap:12px;align-items:center;max-width:1400px;margin:0 auto}
h1{font-size:18px;margin:0;white-space:nowrap;letter-spacing:-.01em}
h1 span{color:var(--mute);font-weight:400}
#q{flex:1;min-width:0;font:inherit;padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--ink);outline:none}
#q:focus{border-color:var(--accent)}
.chips{display:flex;gap:6px;overflow-x:auto;max-width:1400px;margin:10px auto 0;padding-bottom:2px;scrollbar-width:none}
.chip{flex:none;border:1px solid var(--line);background:var(--chip);color:var(--ink);border-radius:999px;padding:4px 11px;font:inherit;font-size:13px;cursor:pointer}
.chip[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:#fff}
.chip small{opacity:.7;margin-left:4px}
main{max-width:1400px;margin:0 auto;padding:16px;display:grid;grid-template-columns:1fr;gap:16px}
@media (min-width:980px){main.open{grid-template-columns:1fr 440px}}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(116px,1fr));gap:10px;align-content:start}
.card{display:flex;flex-direction:column;align-items:center;gap:6px;text-decoration:none;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 8px 10px;text-align:center;font-size:13px;line-height:1.25;box-shadow:var(--shadow);transition:transform .08s}
.card:hover{transform:translateY(-1px);border-color:var(--accent)}
.card.sel{outline:2px solid var(--accent)}
.card img,.ph{width:48px;height:48px}
.ph{display:grid;place-items:center;border-radius:8px;background:var(--slot);color:var(--mute);font-weight:600}
.empty{color:var(--mute);padding:40px 0;text-align:center;grid-column:1/-1}
#detail{display:none;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:var(--shadow);align-self:start;position:sticky;top:120px;max-height:calc(100vh - 136px);overflow:auto}
main.open #detail{display:block}
@media (max-width:979px){#detail{position:fixed;inset:0;top:0;max-height:none;border-radius:0;z-index:10;border:0}}
.dh{display:flex;gap:14px;align-items:center}
.dh img,.dh .ph{width:80px;height:80px;flex:none;background:var(--slot);border-radius:12px;padding:8px}
.dh h2{margin:0;font-size:20px;line-height:1.2}
.id{font:12px ui-monospace,Consolas,monospace;color:var(--mute);user-select:all}
.tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
.tag{font-size:11px;padding:1px 7px;border-radius:999px;background:var(--slot);color:var(--mute)}
#close{margin-left:auto;align-self:flex-start;border:0;background:var(--slot);color:var(--ink);border-radius:8px;width:32px;height:32px;font-size:18px;cursor:pointer;flex:none}
h3{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute);margin:20px 0 8px}
.note p{margin:0 0 8px}
.note a{color:var(--accent);text-decoration:none;font-weight:500}
.rec{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
.st{display:flex;justify-content:space-between;font-size:12px;color:var(--mute);margin-bottom:10px}
.st b{color:var(--ink);font-weight:600}
.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.g3{display:grid;grid-template-columns:repeat(3,44px);gap:3px}
.line{display:flex;gap:6px;flex-wrap:wrap}
.slot{position:relative;display:grid;place-items:center;width:44px;height:44px;background:var(--slot);border-radius:7px;text-decoration:none}
.slot img{width:32px;height:32px}
.slot .ph{width:32px;height:32px;font-size:12px;background:none}
.slot i{position:absolute;right:3px;bottom:0;font-style:normal;font-size:12px;font-weight:700;text-shadow:0 0 3px var(--panel),0 0 3px var(--panel)}
.slot.tagged::after{content:"#";position:absolute;left:4px;top:1px;font-size:10px;color:var(--accent);font-weight:700}
a.slot:hover{outline:2px solid var(--accent)}
.lab{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--mute)}
.arrow{font-size:22px;color:var(--mute)}
.out{width:52px;height:52px}
.out img{width:40px;height:40px}
.uses{display:flex;flex-wrap:wrap;gap:6px}
.use{display:flex;align-items:center;gap:6px;padding:4px 10px 4px 4px;border:1px solid var(--line);border-radius:999px;text-decoration:none;font-size:13px}
.use img,.use .ph{width:24px;height:24px;font-size:10px}
.use:hover{border-color:var(--accent)}
.muted{color:var(--mute);font-size:14px}
table{border-collapse:collapse;width:100%;font-size:14px}
td{padding:4px 6px;border-top:1px solid var(--line)}
td a{display:flex;align-items:center;gap:6px;text-decoration:none}
td img{width:24px;height:24px}
</style>
</head>
<body>
<header>
  <div class="top"><h1>Mechanical <span>register</span></h1><input id="q" type="search" placeholder="Sök item eller block…" autocomplete="off" aria-label="Sök"></div>
  <div class="chips" id="chips"></div>
</header>
<main id="main"><section id="grid" aria-live="polite"></section><aside id="detail"></aside></main>
<script>
const D={"items":[{"id":"mechanical:acacia_firewood","name":"Acacia Firewood","cats":["materials"],"note":"Alla Acacia-logs (även stripped och wood-block) släpper **2 Acacia Firewood** i stället för sig själva. Fällda träd ger Firewood via [[acacia_fallen_log]] → [[acacia_rough_log]] → hugg på en stubbe (2–3 st).\nBygger [[minecraft:campfire]], bränsle i Clay Kiln (1 min), 2 st → Charcoal i Clay Kiln, och 4 av samma sort → 1 Acacia Log. Högerklicka på glöd för att tända elden igen, eller på en brinnande eld för +1 minut (max 10 min).\nBilden visar 1, 2 eller 3 vedträn beroende på antal.","fuel":60.0,"img":"mechanical:acacia_firewood"},{"id":"minecraft:acacia_log","name":"Acacia Log","cats":["changed"],"note":"**Kräver yxa.** Släpper **2 [[acacia_firewood]]** i stället för sig själv. Hugger man en log i ett naturligt träd fälls hela trädet: stammen blir [[acacia_fallen_log]], löven blir Leaf Litter, och en [[acacia_stump]] blir kvar (smyg för att bara hugga en log). 4 Firewood → 1 Log.","fuel":120.0,"img":"minecraft:acacia_log"},{"id":"minecraft:acacia_planks","name":"Acacia Planks","cats":["changed"],"fuel":30.0,"img":"minecraft:acacia_planks"},{"id":"minecraft:acacia_sapling","name":"Acacia Sapling","cats":["vanilla"],"fuel":10.0,"img":"minecraft:acacia_sapling"},{"id":"mechanical:acacia_stump","name":"Acacia Stump","cats":["blocks"],"note":"Blir kvar där man högg när ett Acacia-träd fälls. Har inget item. Ger 1–2 Sticks, bryts snabbast med yxa.\nFungerar som **huggkubbe**: högerklicka en [[acacia_rough_log]] på stubben och hugg den till Firewood.","img":"mechanical:acacia_stump"},{"id":"minecraft:acacia_wood","name":"Acacia Wood","cats":["vanilla"],"fuel":120.0,"img":"minecraft:acacia_wood"},{"id":"mechanical:andesite_chunk","name":"Andesite Rock","cats":["materials"],"note":"Plocka lösa stenar ([[loose_andesite]]) på marken: liten 1 st, mellan 2 st, stor (kräver pickaxe) 3–4 st. Vanilla Andesite släpper också 2–4 rock chunks i stället för sig själv.\nAlla fyra sorterna räknas som rock chunks och kan blandas: stenhuvuden, [[kiln]], och 4 → 1 Cobblestone. Lagar Crude-verktyg.","img":"mechanical:andesite_chunk"},{"id":"mechanical:antler","name":"Antler","cats":["wildlife"],"note":"Styckning av Red Deer-hjortar (1–2 st), Moose- och Reindeer-tjurar. Material för senare recept.","img":"mechanical:antler"},{"id":"mechanical:armor_station","name":"Armor Station","cats":["blocks"],"note":"Crafting: Leather, [[bone_needle]], Leather / Planks, Crafting Table, Planks. Högerklicka för att öppna. Som Tool Station: listan till vänster visar rustningarna du låst upp (Leather → läderrustning, [[bear_pelt]] → pälsrustning), klicka för att lägga i delarna. Bone Needle ligger kvar och tappar 1 per del.","img":"mechanical:armor_station"},{"id":"minecraft:arrow","name":"Arrow","cats":["changed","removed"],"note":"Vanilla-receptet borttaget. Görs i Fletching Table: Flint + Stick + Feather → 4 Arrow.","removedRecipes":["minecraft:arrow"],"img":"minecraft:arrow"},{"id":"minecraft:azalea","name":"Azalea","cats":["vanilla"],"fuel":10.0,"img":"minecraft:azalea"},{"id":"minecraft:bamboo_planks","name":"Bamboo Planks","cats":["vanilla"],"fuel":30.0,"img":"minecraft:bamboo_planks"},{"id":"mechanical:barbed_arrow","name":"Barbed Arrow","cats":["tools"],"note":"Fletching Table: [[bear_claw]] + Stick + Feather → 4 st. 3 skada.","img":"mechanical:barbed_arrow"},{"id":"mechanical:bark","name":"Bark","cats":["materials"],"note":"Håll in högerklick med yxa på en [[oak_fallen_log]] (valfritt träslag): första steget tar av barken och ger 1–2 Bark.\n**Tändmaterial:** högerklicka med Bark på en släckt Campfire eller Clay Kiln, då lyckas [[fire_drill]] i 75 % av försöken. Används också till bast ([[plant_fibre]]) och [[bark_basket]].","img":"mechanical:bark"},{"id":"mechanical:bark_basket","name":"Bark Basket","cats":["tools"],"note":"**Högerklicka för att öppna** (3×3). Rymmer bara frukt, bär, svamp och hudar (Apple, Sweet Berries, Glow Berries, Melon Slice, vilda bär, svampar, Leather, Rabbit Hide, Raw Hide, Scraped Hide …). Innehållet sparas i korgen. Stackar inte.","img":"mechanical:bark_basket"},{"id":"mechanical:bear_claw","name":"Bear Claw","cats":["wildlife"],"note":"Brown Bear, andra omgången (60 %, 1–3 st, kräver Tusk Dagger eller Iron Knife). Används till [[barbed_arrow]] och [[bear_rug]].","img":"mechanical:bear_claw"},{"id":"mechanical:bear_fat","name":"Bear Fat","cats":["wildlife"],"note":"Brown Bear, andra omgången (80 %, 1–3 st, kräver Tusk Dagger eller Iron Knife). Laga på Campfire → 2 [[tallow]].","img":"mechanical:bear_fat"},{"id":"mechanical:bear_pelt","name":"Bear Pelt","cats":["wildlife"],"note":"Första omgången när man styckar en Brown Bear (**kräver Tusk Dagger eller Iron Knife**). Används till Fur-rustning och [[bear_rug]].","img":"mechanical:bear_pelt"},{"id":"mechanical:bear_rug","name":"Bear Rug","cats":["blocks"],"note":"[[bear_pelt]] + [[bear_claw]]. Platt dekoration (som en matta) med huvudet bort från den som placerar den.","img":"mechanical:bear_rug"},{"id":"mechanical:beef_scraps","name":"Beef Scraps","cats":["food"],"note":"Andra omgången när man styckar en Carcass med kniv: Cow, Mooshroom, Aurochs. 1 hunger.\nLaga på en Campfire (20 s) → [[cooked_beef_scraps]]. Ta av den i tid, annars blir den [[burnt_food]].","img":"mechanical:beef_scraps"},{"id":"mechanical:birch_firewood","name":"Birch Firewood","cats":["materials"],"note":"Alla Birch-logs (även stripped och wood-block) släpper **2 Birch Firewood** i stället för sig själva. Fällda träd ger Firewood via [[birch_fallen_log]] → [[birch_rough_log]] → hugg på en stubbe (2–3 st).\nBygger [[minecraft:campfire]], bränsle i Clay Kiln (1 min), 2 st → Charcoal i Clay Kiln, och 4 av samma sort → 1 Birch Log. Högerklicka på glöd för att tända elden igen, eller på en brinnande eld för +1 minut (max 10 min).\nBilden visar 1, 2 eller 3 vedträn beroende på antal.","fuel":60.0,"img":"mechanical:birch_firewood"},{"id":"minecraft:birch_log","name":"Birch Log","cats":["changed"],"note":"**Kräver yxa.** Släpper **2 [[birch_firewood]]** i stället för sig själv. Hugger man en log i ett naturligt träd fälls hela trädet: stammen blir [[birch_fallen_log]], löven blir Leaf Litter, och en [[birch_stump]] blir kvar (smyg för att bara hugga en log). 4 Firewood → 1 Log.","fuel":120.0,"img":"minecraft:birch_log"},{"id":"minecraft:birch_planks","name":"Birch Planks","cats":["changed"],"fuel":30.0,"img":"minecraft:birch_planks"},{"id":"minecraft:birch_sapling","name":"Birch Sapling","cats":["vanilla"],"fuel":10.0,"img":"minecraft:birch_sapling"},{"id":"mechanical:birch_stump","name":"Birch Stump","cats":["blocks"],"note":"Blir kvar där man högg när ett Birch-träd fälls. Har inget item. Ger 1–2 Sticks, bryts snabbast med yxa.\nFungerar som **huggkubbe**: högerklicka en [[birch_rough_log]] på stubben och hugg den till Firewood.","img":"mechanical:birch_stump"},{"id":"minecraft:birch_wood","name":"Birch Wood","cats":["vanilla"],"fuel":120.0,"img":"minecraft:birch_wood"},{"id":"minecraft:black_bed","name":"Black Bed","cats":["removed"],"removedRecipes":["minecraft:black_bed","minecraft:dye_black_bed"],"img":"minecraft:black_bed"},{"id":"minecraft:blast_furnace","name":"Blast Furnace","cats":["removed"],"removedRecipes":["minecraft:blast_furnace"],"img":"minecraft:blast_furnace"},{"id":"mechanical:tin_block","name":"Block of Tin","cats":["blocks"],"note":"9 [[tin_ingot]]. Hör till bronsåldern.","img":"mechanical:tin_block"},{"id":"mechanical:blood","name":"Blood","cats":["blocks"],"note":"Bloddroppar på marken från blödande djur (under 50 % hälsa) och styckning. Går att spåra, bleknar efter några minuter. Har inget item.","img":"mechanical:blood"},{"id":"minecraft:blue_bed","name":"Blue Bed","cats":["removed"],"removedRecipes":["minecraft:blue_bed","minecraft:dye_blue_bed"],"img":"minecraft:blue_bed"},{"id":"minecraft:blue_egg","name":"Blue Egg","cats":["vanilla"],"img":"minecraft:blue_egg"},{"id":"mechanical:blueberries","name":"Blueberries","cats":["foraging"],"note":"Plockas från en mogen [[blueberry_bush]] (högerklicka). 1 hunger. Kan inte planteras än. Får plats i [[bark_basket]].","img":"mechanical:blueberries"},{"id":"mechanical:blueberry_bush","name":"Blueberry Bush","cats":["foraging"],"note":"Vild buske i Forest, Dark Forest, Taiga, Old Growth Pine Taiga. Sällsynt, i små grupper. Växer bar → blommor → omogen → mogen (~6 min per steg i ljus).\n**Högerklicka en mogen buske → 1–3 [[blueberries]]**, sedan börjar den om från blommor. Hugger man sönder den: 1–2 Sticks + 1–2 Plant Fibre, och den är borta. Brown Bear äter gärna mogna bär.","img":"mechanical:blueberry_bush"},{"id":"mechanical:boiled_egg","name":"Boiled Egg","cats":["materials"],"note":"Valfritt ägg (vanligt, blått, brunt) på en Campfire (15 s). Stackar 16. Går inte att äta med skalet på.\n**Skala:** Boiled Egg i craftingrutan → [[peeled_egg]] + [[eggshell]].","img":"mechanical:boiled_egg"},{"id":"minecraft:bone","name":"Bone","cats":["changed"],"note":"Från [[bone_pile]] (15 %). Används till [[bone_arrow]].","img":"minecraft:bone"},{"id":"mechanical:bone_arrow","name":"Bone Arrow","cats":["tools"],"note":"Fletching Table: [[fish_bones]] eller Bone + Stick + Feather → 4 st. 1,5 skada (vanlig pil 2).","img":"mechanical:bone_arrow"},{"id":"mechanical:bone_fish_hook","name":"Bone Fish Hook","cats":["materials"],"note":"[[fish_bones]] + kniv (crafting, kniven slits 1). Huvud till [[bone_hook_fishing_rod]] i Tool Station.","img":"mechanical:bone_fish_hook"},{"id":"mechanical:bone_hook_fishing_rod","name":"Bone Hook Fishing Rod","cats":["tools"],"note":"Tool Station: [[bone_fish_hook]] + [[twine]] + [[tool_rod]]. Napp kommer 5 s snabbare (som Lure I, utöver förtrollningar). Hållbarhet 48.","img":"mechanical:bone_hook_fishing_rod"},{"id":"minecraft:bone_meal","name":"Bone Meal","cats":["vanilla"],"img":"minecraft:bone_meal"},{"id":"mechanical:bone_needle","name":"Bone Needle","cats":["tools"],"note":"Fish Bones, Bone eller [[horn]] + kniv (crafting). 32 i hållbarhet. Verktyg i [[armor_station]]: tappar 1 per sydd rustningsdel.","img":"mechanical:bone_needle"},{"id":"mechanical:bone_pile","name":"Bone Pile","cats":["blocks"],"note":"Blir kvar där ett djur styckats färdigt och försvinner aldrig. Man går igenom den. Bryts den: Bone 15 %, Bone Meal 1–2 (25 %). Har inget item.","img":"mechanical:bone_pile"},{"id":"minecraft:bow","name":"Bow","cats":["removed"],"removedRecipes":["minecraft:bow"],"img":"minecraft:bow"},{"id":"minecraft:brick","name":"Brick","cats":["changed"],"note":"Bränns i Clay Kiln av 1 Clay Ball (20 s).","img":"minecraft:brick"},{"id":"minecraft:brown_bed","name":"Brown Bed","cats":["removed"],"removedRecipes":["minecraft:brown_bed","minecraft:dye_brown_bed"],"img":"minecraft:brown_bed"},{"id":"minecraft:brown_egg","name":"Brown Egg","cats":["vanilla"],"img":"minecraft:brown_egg"},{"id":"minecraft:brown_mushroom","name":"Brown Mushroom","cats":["vanilla"],"img":"minecraft:brown_mushroom"},{"id":"mechanical:burnt_food","name":"Burnt Food","cats":["food"],"note":"Mat som legat kvar på en Campfire 30–60 s efter att den blev klar.","img":"mechanical:burnt_food"},{"id":"minecraft:campfire","name":"Campfire","cats":["changed"],"note":"Nytt recept: Sticks + 3 Firewood (valfritt träslag, kan blandas). **Placeras släckt**, tänds med [[fire_drill]].\nBrinner 3–5 min, sedan **glöd** i 2 min, sedan helt slocknad. Kyla och regn gör att den brinner ut fortare. Högerklick med Firewood: på glöd → brinner igen; på brinnande eld → +1 min (max 10 min).\n**Matlagning:** maten ligger kvar när den är klar och blir [[burnt_food]] efter 30–60 s till. Högerklicka med tom hand för att ta av maten.\nGår sönder till 1–3 Stick (inte Charcoal). Brinnande eld värmer (inom 6 block) och håller monster borta. Bas för [[kiln]].","img":"minecraft:campfire"},{"id":"minecraft:candle","name":"Candle","cats":["changed","removed"],"note":"Nytt recept: Twine + 2 [[tallow]] → 2 Candle (Honeycomb-receptet borttaget). Tänds med [[fire_drill]] (60 %). Monster slår inte sönder ljus, men en zombiehord blåser ut dem.","removedRecipes":["minecraft:candle"],"img":"minecraft:candle"},{"id":"mechanical:chanterelle","name":"Chanterelle","cats":["foraging"],"note":"Växer i Forest, Birch Forest, Taiga, Old Growth Birch/Pine. **Högerklicka (eller bryt) för att plocka.** Sprider sig långsamt i skugga (ljus ≤ 12) om det finns färre än 4 av samma sort runt omkring. Rå: 1 hunger. Ätlig: kan rostas till [[roasted_mushrooms]]. Kan inte planteras än. Släpper alltid med kniv, hälften av gångerna utan.","img":"mechanical:chanterelle"},{"id":"minecraft:charcoal","name":"Charcoal","cats":["changed"],"note":"Bränns i Clay Kiln av 1 Log eller 2 Firewood (30 s). Bästa bränslet (4 min). Campfire släpper inte längre Charcoal.","fuel":240.0,"img":"minecraft:charcoal"},{"id":"mechanical:cherry_firewood","name":"Cherry Firewood","cats":["materials"],"note":"Alla Cherry-logs (även stripped och wood-block) släpper **2 Cherry Firewood** i stället för sig själva. Fällda träd ger Firewood via [[cherry_fallen_log]] → [[cherry_rough_log]] → hugg på en stubbe (2–3 st).\nBygger [[minecraft:campfire]], bränsle i Clay Kiln (1 min), 2 st → Charcoal i Clay Kiln, och 4 av samma sort → 1 Cherry Log. Högerklicka på glöd för att tända elden igen, eller på en brinnande eld för +1 minut (max 10 min).\nBilden visar 1, 2 eller 3 vedträn beroende på antal.","fuel":60.0,"img":"mechanical:cherry_firewood"},{"id":"minecraft:cherry_log","name":"Cherry Log","cats":["changed"],"note":"**Kräver yxa.** Släpper **2 [[cherry_firewood]]** i stället för sig själv. Hugger man en log i ett naturligt träd fälls hela trädet: stammen blir [[cherry_fallen_log]], löven blir Leaf Litter, och en [[cherry_stump]] blir kvar (smyg för att bara hugga en log). 4 Firewood → 1 Log.","fuel":120.0,"img":"minecraft:cherry_log"},{"id":"minecraft:cherry_planks","name":"Cherry Planks","cats":["changed"],"fuel":30.0,"img":"minecraft:cherry_planks"},{"id":"minecraft:cherry_sapling","name":"Cherry Sapling","cats":["vanilla"],"fuel":10.0,"img":"minecraft:cherry_sapling"},{"id":"mechanical:cherry_stump","name":"Cherry Stump","cats":["blocks"],"note":"Blir kvar där man högg när ett Cherry-träd fälls. Har inget item. Ger 1–2 Sticks, bryts snabbast med yxa.\nFungerar som **huggkubbe**: högerklicka en [[cherry_rough_log]] på stubben och hugg den till Firewood.","img":"mechanical:cherry_stump"},{"id":"minecraft:cherry_wood","name":"Cherry Wood","cats":["vanilla"],"fuel":120.0,"img":"minecraft:cherry_wood"},{"id":"mechanical:chicken_scraps","name":"Chicken Scraps","cats":["food"],"note":"Andra omgången när man styckar en Carcass med kniv: Chicken, Pheasant. 1 hunger.\nLaga på en Campfire (20 s) → [[cooked_chicken_scraps]]. Ta av den i tid, annars blir den [[burnt_food]].","img":"mechanical:chicken_scraps"},{"id":"minecraft:clay_ball","name":"Clay Ball","cats":["vanilla"],"img":"minecraft:clay_ball"},{"id":"mechanical:kiln","name":"Clay Kiln","cats":["blocks"],"note":"**Placeras bara ovanpå en Campfire**, som blir ugnens eldstad (2 block hög). Var Campfire tänd bakar ugnen på lägereldens ved (3 min). Annars: lägg bränsle och tänd med [[fire_drill]].\nGUI som en Furnace. Bränsle går bara åt medan något bakas; tänd utan att baka pyr den i 60 s och slocknar. Kyla och regn gör att bränslet tar slut fortare. Lyser (ljus 13) och skyddar mot monster när den brinner.\nBryts någon halva får man tillbaka Clay Kiln + 1–3 Stick + innehållet.","img":"mechanical:kiln"},{"id":"mechanical:cloudberries","name":"Cloudberries","cats":["foraging"],"note":"Plockas från en mogen [[cloudberry_bush]] (högerklicka). 1 hunger. Kan inte planteras än. Får plats i [[bark_basket]].","img":"mechanical:cloudberries"},{"id":"mechanical:cloudberry_bush","name":"Cloudberry Bush","cats":["foraging"],"note":"Vild buske i Swamp, Snowy Plains, Snowy Taiga, Grove. Sällsynt, i små grupper. Växer bar → blommor → omogen → mogen (~6 min per steg i ljus).\n**Högerklicka en mogen buske → 1–3 [[cloudberries]]**, sedan börjar den om från blommor. Hugger man sönder den: 1–2 Sticks + 1–2 Plant Fibre, och den är borta. Brown Bear äter gärna mogna bär.","img":"mechanical:cloudberry_bush"},{"id":"minecraft:coal","name":"Coal","cats":["vanilla"],"fuel":240.0,"img":"minecraft:coal"},{"id":"minecraft:cobblestone","name":"Cobblestone","cats":["changed"],"note":"4 rock chunks → 1 Cobblestone (sten släpper chunks i stället för cobblestone).","img":"minecraft:cobblestone"},{"id":"mechanical:cooked_beef_scraps","name":"Cooked Beef Scraps","cats":["food"],"note":"[[beef_scraps]] lagad på en Campfire (20 s). 3 hunger (vanilla Cooked Beef = 8). Ligger kvar på elden när den är klar: högerklicka med tom hand för att ta av den innan den bränns.","img":"mechanical:cooked_beef_scraps"},{"id":"mechanical:cooked_chicken_scraps","name":"Cooked Chicken Scraps","cats":["food"],"note":"[[chicken_scraps]] lagad på en Campfire (20 s). 2 hunger (vanilla Cooked Beef = 8). Ligger kvar på elden när den är klar: högerklicka med tom hand för att ta av den innan den bränns.","img":"mechanical:cooked_chicken_scraps"},{"id":"mechanical:cooked_game_meat_scraps","name":"Cooked Game Meat Scraps","cats":["food"],"note":"[[game_meat_scraps]] lagad på en Campfire (20 s). 3 hunger (vanilla Cooked Beef = 8). Ligger kvar på elden när den är klar: högerklicka med tom hand för att ta av den innan den bränns.","img":"mechanical:cooked_game_meat_scraps"},{"id":"mechanical:cooked_mutton_scraps","name":"Cooked Mutton Scraps","cats":["food"],"note":"[[mutton_scraps]] lagad på en Campfire (20 s). 2 hunger (vanilla Cooked Beef = 8). Ligger kvar på elden när den är klar: högerklicka med tom hand för att ta av den innan den bränns.","img":"mechanical:cooked_mutton_scraps"},{"id":"mechanical:cooked_porkchop_scraps","name":"Cooked Pork Scraps","cats":["food"],"note":"[[porkchop_scraps]] lagad på en Campfire (20 s). 3 hunger (vanilla Cooked Beef = 8). Ligger kvar på elden när den är klar: högerklicka med tom hand för att ta av den innan den bränns.","img":"mechanical:cooked_porkchop_scraps"},{"id":"mechanical:cooked_rabbit_scraps","name":"Cooked Rabbit Scraps","cats":["food"],"note":"[[rabbit_scraps]] lagad på en Campfire (20 s). 2 hunger (vanilla Cooked Beef = 8). Ligger kvar på elden när den är klar: högerklicka med tom hand för att ta av den innan den bränns.","img":"mechanical:cooked_rabbit_scraps"},{"id":"mechanical:cooked_venison_scraps","name":"Cooked Venison Scraps","cats":["food"],"note":"[[venison_scraps]] lagad på en Campfire (20 s). 3 hunger (vanilla Cooked Beef = 8). Ligger kvar på elden när den är klar: högerklicka med tom hand för att ta av den innan den bränns.","img":"mechanical:cooked_venison_scraps"},{"id":"minecraft:copper_axe","name":"Copper Axe","cats":["removed"],"removedRecipes":["minecraft:copper_axe"],"img":"minecraft:copper_axe"},{"id":"minecraft:copper_boots","name":"Copper Boots","cats":["removed"],"removedRecipes":["minecraft:copper_boots"],"img":"minecraft:copper_boots"},{"id":"minecraft:copper_chestplate","name":"Copper Chestplate","cats":["removed"],"removedRecipes":["minecraft:copper_chestplate"],"img":"minecraft:copper_chestplate"},{"id":"minecraft:copper_helmet","name":"Copper Helmet","cats":["removed"],"removedRecipes":["minecraft:copper_helmet"],"img":"minecraft:copper_helmet"},{"id":"minecraft:copper_hoe","name":"Copper Hoe","cats":["removed"],"removedRecipes":["minecraft:copper_hoe"],"img":"minecraft:copper_hoe"},{"id":"minecraft:copper_leggings","name":"Copper Leggings","cats":["removed"],"removedRecipes":["minecraft:copper_leggings"],"img":"minecraft:copper_leggings"},{"id":"minecraft:copper_pickaxe","name":"Copper Pickaxe","cats":["removed"],"removedRecipes":["minecraft:copper_pickaxe"],"img":"minecraft:copper_pickaxe"},{"id":"minecraft:copper_shovel","name":"Copper Shovel","cats":["removed"],"removedRecipes":["minecraft:copper_shovel"],"img":"minecraft:copper_shovel"},{"id":"minecraft:copper_spear","name":"Copper Spear","cats":["remo xe","name":"Crude Stone Pickaxe","cats":["tools"],"note":"Tool Station: [[stone_pickaxe_head]] + [[twine]] + Stick. Bryter som sten men långsammare, 80 i hållbarhet. Lagas med rock chunks. Låses upp när man har en rock chunk.","img":"mechanical:crude_stone_pickaxe"},{"id":"minecraft:cyan_bed","name":"Cyan Bed","cats":["removed"],"removedRecipes":["minecraft:cyan_bed","minecraft:dye_cyan_bed"],"img":"minecraft:cyan_bed"},{"id":"mechanical:dark_oak_firewood","name":"Dark Oak Firewood","cats":["materials"],"note":"Alla Dark Oak-logs (även stripped och wood-block) släpper **2 Dark Oak Firewood** i stället för sig själva. Fällda träd ger Firewood via [[dark_oak_fallen_log]] → [[dark_oak_rough_log]] → hugg på en stubbe (2–3 st).\nBygger [[minecraft:campfire]], bränsle i Clay Kiln (1 min), 2 st → Charcoal i Clay Kiln, och 4 av samma sort → 1 Dark Oak Log. Högerklicka på glöd för att tända elden igen, eller på en brinnande eld för +1 minut (max 10 min).\nBilden visar 1, 2 eller 3 vedträn beroende på antal.","fuel":60.0,"img":"mechanical:dark_oak_firewood"},{"id":"minecraft:dark_oak_log","name":"Dark Oak Log","cats":["changed"],"note":"**Kräver yxa.** Släpper **2 [[dark_oak_firewood]]** i stället för sig själv. Hugger man en log i ett naturligt träd fälls hela trädet: stammen blir [[dark_oak_fallen_log]], löven blir Leaf Litter, och en [[dark_oak_stump]] blir kvar (smyg för att bara hugga en log). 4 Firewood → 1 Log.","fuel":120.0,"img":"minecraft:dark_oak_log"},{"id":"minecraft:dark_oak_planks","name":"Dark Oak Planks","cats":["changed"],"fuel":30.0,"img":"minecraft:dark_oak_planks"},{"id":"minecraft:dark_oak_sapling","name":"Dark Oak Sapling","cats":["vanilla"],"fuel":10.0,"img":"minecraft:dark_oak_sapling"},{"id":"mechanical:dark_oak_stump","name":"Dark Oak Stump","cats":["blocks"],"note":"Blir kvar där man högg när ett Dark Oak-träd fälls. Har inget item. Ger 1–2 Sticks, bryts snabbast med yxa.\nFungerar som **huggkubbe**: högerklicka en [[dark_oak_rough_log]] på stubben  ett fällt Acacia-träd blir liggande som Fallen Logs där den landar. Har inget item.\n**Håll in högerklick med yxa** (ett tungt hugg var 0,6 s, 4 hugg per steg med Flint Axe, 3 med Stone Axe, 2 med Iron Axe; yxan slits 1 per steg): barken av (1–2 [[bark]]) → smalare → ännu smalare → [[acacia_rough_log]] (eller bara 2–3 Sticks om det misslyckas). Bryts den vanligt blir det bara 1–2 Sticks.","img":"mechanical:acacia_fallen_log"},{"id":"mechanical:birch_fallen_log","name":"Fallen Birch Log","cats":["blocks"],"note":"Stammen av ett fällt Birch-träd blir liggande som Fallen Logs där den landar. Har inget item.\n**Håll in högerklick med yxa** (ett tungt hugg var 0,6 s, 4 hugg per steg med Flint Axe, 3 med Stone Axe, 2 med Iron Axe; yxan slits 1 per steg): barken av (1–2 [[bark]]) → smalare → ännu smalare → [[birch_rough_log]] (eller bara 2–3 Sticks om det misslyckas). Bryts den vanligt blir det bara 1–2 Sticks.","img":"mechanical:birch_fallen_log"},{"id":"mechanical:cherry_fallen_log","name":"Fallen Cherry Log","cats":["blocks"],"note":"Stammen av ett fällt Cherry-träd blir liggande som Fallen Logs där den landar. Har inget item.\n**Håll in högerklick med yxa** (ett tungt hugg var 0,6 s, 4 hugg per steg med Flint Axe, 3 med Stone Axe, 2 med Iron Axe; yxan slits 1 per steg): barken av (1–2 [[bark]]) → smalare → ännu smalare → [[cherry_rough_log]] (eller bara 2–3 Sticks om det misslyckas). Bryts den vanligt blir det bara 1–2 Sticks.","img":"mechanical:cherry_fallen_log"},{"id":"mechanical:dark_oak_fallen_log","name":"Fallen Dark Oak Log","cats":["blocks"],"note":"Stammen av ett fällt Dark Oak-träd blir liggande som Fallen Logs där den landar. Har inget item.\n**Håll in högerklick med yxa** (ett tungt hugg var 0,6 s, 4 hugg per steg med Flint Axe, 3 med Stone Axe, 2 med Iron Axe; yxan slits 1 per steg): barken av (1–2 [[bark]]) → smalare → ännu smalare → [[dark_oak_rough_log]] (eller bara 2–3 Sticks om det misslyckas). Bryts den vanligt blir det bara 1–2 Sticks.","img":"mechanical:dark_oak_fallen_log"},{"id":"mechanical:jungle_fallen_log","name":"Fallen Jungle Log","cats":["blocks"],"note":"Stammen av ett fällt Jungle-träd blir liggande som Fallen Logs där den landar. Har inget item.\n**Håll in högerklick med yxa** (ett tungt hugg var 0,6 s, 4 hugg per steg med Flint Axe, 3 med Stone Axe, 2 med Iron Axe; yxan slits 1 per steg): barken av (1–2 [[bark]]) → smalare → ännu smalare → [[jungle_rough_log]] (eller bara 2–3 Sticks om det misslyckas). Bryts den vanligt blir det bara 1–2 Sticks.","img":"mechanical:jungle_fallen_log"},{"id":"mechanical:mangrove_fallen_log","name":"Fallen Mangrove Log","cats":["blocks"],"note":"Stammen av ett fällt Mangrove-träd blir liggande som Fallen Logs där den landar. Har inget item.\n**Håll in högerklick med yxa** (ett tungt hugg var 0,6 s, 4 hugg per steg med Flint Axe, 3 med Stone Axe, 2 med Iron Axe; yxan slits 1 per steg): barken av (1–2 [[bark]]) → smalare → ännu smalare → [[mangrove_rough_log]] (eller bara 2–3 Sticks om det misslyckas). Bryts den vanligt blir det bara 1–2 Sticks.","img":"mechanical:mangrove_fallen_log"},{"id":"mechanical:oak_fallen_log","name":"Fallen Oak Log","cats":["blocks"],"note":"Stammen av ett fällt Oak-träd blir liggande som Fallen Logs där den landar. Har inget item.\n**Håll in högerklick med yxa** (ett tungt hugg var 0,6 s, 4 hugg per steg med Flint Axe, 3 med Stone Axe, 2 med Iron Axe; yxan slits 1 per steg): barken av (1–2 [[bark]]) → smalare → ännu smalare → [[oak_rough_log]] (eller bara 2–3 Sticks om det misslyckas). Bryts den vanligt blir det bara 1–2 Sticks.","img":"mechanical:oak_fallen_log"},{"id":"mechanical:pale_oak_fallen_log","name":"Fallen Pale Oak Log","cats":["blocks"],"note":"Stammen av ett fällt Pale Oak-träd blir liggande som Fallen Logs där den landar. Har inget item.\n**Håll in högerklick med yxa** (ett tungt hugg var 0,6 s, 4 hugg per steg med Flint Axe, 3 med Stone Axe, 2 med Iron Axe; yxan slits 1 per steg): barken av (1–2 [[bark]]) → smalare → ännu smalare → [[pale_oak_rough_log]] (eller bara 2–3 Sticks om det misslyckas). Bryts den vanligt blir det bara 1–2 Sticks.","img":"mechanical:pale_oak_fallen_log"},{"id":"mechanical:poplar_fallen_log","name":"Fallen Poplar Log","cats":["blocks"],"note":"Stammen av ett fällt Poplar-träd blir liggande som Fallen Logs där den landar. Har inget item.\n**Håll in högerklick med yxa** (ett tungt hugg var 0,6 s, 4 hugg per steg med Flint Axe, 3 med Stone Axe, 2 med Iron Axe; yxan slits 1 per steg): barken av (1–2 [[bark]]) → smalare → ännu smalare → [[poplar_rough_log]] (eller bara 2–3 Sticks om det misslyckas). Bryts den vanligt blir det bara 1–2 Sticks.","img":"mechanical:poplar_fallen_log"},{"id":"mechanical:spruce_fallen_log","name":"Fallen Spruce Log","cats":["blocks"],"note":"Stammen av ett fällt Spruce-träd blir liggande som Fallen Logs där den landar. Har inget item.\n**Håll in högerklick med yxa** (ett tungt hugg var 0,6 s, 4 hugg per steg med Flint Axe, 3 med Stone Axe, 2 med Iron Axe; yxan slits 1 per steg): barken av (1–2 [[bark]]) → smalare → ännu smalare → [[spruce_rough_log]] (eller bara 2–3 Sticks om det misslyckas). Bryts den vanligt blir det bara 1–2 Sticks.","img":"mechanical:spruce_fallen_log"},{"id":"minecraft:cow_spawn_egg","name":"Farm-djur","cats":["changed"],"note":"Cow, Sheep, Pig, Chicken, Horse, Donkey och Llama spawnar inte i naturen. Hagen får 4 djur en gång; de despawnar aldrig men det kommer inga fler. Vilda djur lämnar en **Carcass** som styckas med kniv i stället för loot.","img":"minecraft:cow_spawn_egg"},{"id":"minecraft:feather","name":"Feather","cats":["changed"],"note":"Styckning av Chicken och Parrot (80 %, 1–2 st) och Pheasant (2–3 st). Används i Fletching Table.","img":"minecraft:feather"},{"id":"mechanical:fire_arrow","name":"Fire Arrow","cats":["tools"],"note":"Fletching Table: [[tallow]] + Arrow + [[twine]] → 1 st. Sätter målet i brand.","img":"mechanical:fire_arrow"},{"id":"mechanical:fire_drill","name":"Fire Drill","cats":["tools"],"note":"Högerklicka på en släckt Campfire eller Clay Kiln. Lyckas ungefär var tredje gång (33 %), med tändmaterial ([[bark]] eller Leaf Litter, högerklicka först) 75 %. Tänder även Candle (60 %). Varje försök kostar 1 i hållbarhet (16). En Clay Kiln måste ha bränsle för att tändas.","img":"mechanical:fire_drill"},{"id":"mechanical:fish_bones","name":"Fish Bones","cats":["wildlife"],"note":"Fås när man rensar Whole fish med kniv. → 1 Bone Meal, [[bone_fish_hook]], eller [[bone_arrow]] i Fletching Table.","img":"mechanical:fish_bones"},{"id":"minecraft:fishing_rod","name":"Fishing Rod","cats":["removed"],"removedRecipes":["minecraft:fishing_rod"],"img":"minecraft:fishing_rod"},{"id":"minecraft:fletching_table","name":"Fletching Table","cats":["changed"],"note":"**Högerklicka för att öppna** (smyg + högerklick för att placera block mot den). Tre platser + resultat: pilar ([[minecraft:arrow]], [[bone_arrow]], [[barbed_arrow]], [[fire_arrow]]) och [[sinew_bow]].","img":"minecraft:fletching_table"},{"id":"minecraft:flint","name":"Flint","cats":["vanilla"],"img":"minecraft:flint"},{"id":"mechanical:flint_axe","name":"Flint Axe","cats":["tools"],"note":"Första yxan, 2×2-recept som går i inventoryt: Logs kan inte brytas utan yxa. Bryter som trä (sten → cobblestone, men inte järnmalm). Hållbarhet 48, lagas med Flint. Låses upp i receptboken när man får Flint. 4 skada.\nHugg en log i ett naturligt träd → hela trädet fälls (smyg för att hugga en enda log). Håll in högerklick på Fallen Logs och Rough Logs för att bearbeta dem.","img":"mechanical:flint_axe"},{"id":"mechanical:flint_hoe","name":"Flint Hoe","cats":["tools"],"note":"Bryter som trä (sten → cobblestone, men inte järnmalm). Hållbarhet 48, lagas med Flint. Låses upp i receptboken när man får Flint.","img":"mechanical:flint_hoe"},{"id":"mechanical:flint_knife","name":"Flint Knife","cats":["tools"],"note":"Kniv: ligger kvar i rutan i recept och slits 1 (stenhuvuden, Tool Rod, Scraped Hide, rensa fisk, bast, Bone Fish Hook). 2,5 skada, hållbarhet 48.\nGer 60 % chans på [[plant_fibre]] från gräs. **Håll in högerklick på en Carcass** för att stycka djuret i två omgångar (hud/fjädrar/ull, sedan kött). ~2 s per omgång, kniven slits 1 per omgång. För svag för Brown Bear.","img":"mechanical:flint_knife"},{"id":"mechanical:flint_pickaxe","name":"Flint Pickaxe","cats":["tools"],"note":"Bryter som trä (sten → cobblestone, men inte järnmalm). Hållbarhet 48, lagas med Flint. Låses upp i receptboken när man får Flint.","img":"mechanical:flint_pickaxe"},{"id":"mechanical:flint_shovel","name":"Flint Shovel","cats":["tools"],"note":"Bryter som trä (sten → cobblestone, men inte järnmalm). Hållbarhet 48, lagas med Flint. Låses upp i receptboken när man får Flint.","img":"mechanical:flint_shovel"},{"id":"mechanical:flint_spear","name":"Flint Spear","cats":["tools"],"note":"Tool Station: huvud Flint, bindning [[cordage]], skaft [[tool_rod]]. Ersätter Stone Spear.\nFungerar som vanilla Stone Spear: 2 skada vid stöt (vänsterklick), **håll in högerklick och spring** för ansats (skadan beror på farten). Hållbarhet 100.","img":"mechanical:flint_spear"},{"id":"minecraft:flowering_azalea","name":"Flowering Azalea","cats":["vanilla"],"fuel":10.0,"img":"minecraft:flowering_azalea"},{"id":"mechanical:fly_agaric","name":"Fly Agaric","cats":["foraging"],"note":"Växer i Birch Forest, Taiga, Snowy Taiga, Dark Forest. **Högerklicka (eller bryt) för att plocka.** Sprider sig långsamt i skugga (ljus ≤ 12) om det finns färre än 4 av samma sort runt omkring. Rå: **Giftig:** Poison 10 s + Nausea 15 s. Kan inte planteras än. Släpper alltid med kniv, hälften av gångerna utan.","img":"mechanical:fly_agaric"},{"id":"mechanical:fur_boots","name":"Fur Boots","cats":["materials"],"note":"Sys i [[armor_station]] av Bear Pelt + Sinew med [[bone_needle]]. Lagas med Bear Pelt. **Isolerar 25 % per del mot kyla** (läder 15 %; full Fur-rustning = ingen kyla).","img":"mechanical:fur_boots"},{"id":"mechanical:fur_coat","name":"Fur Coat","cats":["materials"],"note":"Sys i [[armor_station]] av Bear Pelt + Sinew med [[bone_needle]]. Lagas med Bear Pelt. **Isolerar 25 % per del mot kyla** (läder 15 %; full Fur-rustning = ingen kyla).","img":"mechanical:fur_coat"},{"id":"mechanical:fur_hood","name":"Fur Hood","cats":["materials"],"note":"Sys i [[armor_station]] av Bear Pelt + Sinew med [[bone_needle]]. Lagas med Bear Pelt. **Isolerar 25 % per del mot kyla** (läder 15 %; full Fur-rustning = ingen kyla).","img":"mechanical:fur_hood"},{"id":"mechanical:fur_leggings","name":"Fur Leggings","cats":["materials"],"note":"Sys i [[armor_station]] av Bear Pelt + Sinew med [[bone_needle]]. Lagas med Bear Pelt. **Isolerar 25 % per del mot kyla** (läder 15 %; full Fur-rustning = ingen kyla).","img":"mechanical:fur_leggings"},{"id":"minecraft:furnace","name":"Furnace","cats":["changed","removed"],"note":"Borttagen (ersätts av [[kiln]], uppgraderas senare). Smoker och Blast Furnace är också borttagna.","removedRecipes":["minecraft:furnace"],"img":"minecraft:furnace"},{"id":"mechanical:game_meat_scraps","name":"Game Meat Scraps","cats":["food"],"note":"Andra omgången när man styckar en Carcass med kniv: övriga djur (häst, lama, björn, papegoja …). 1 hunger.\nLaga på en Campfire (20 s) → [[cooked_game_meat_scraps]]. Ta av den i tid, annars blir den [[burnt_food]].","img":"mechanical:game_meat_scraps"},{"id":"minecraft:golden_boots","name":"Golden Boots","cats":["removed"],"removedRecipes":["minecraft:golden_boots"],"img":"minecraft:golden_boots"},{"id":"minecraft:golden_chestplate","name":"Golden Chestplate","cats":["removed"],"removedRecipes":["minecraft:golden_chestplate"],"img":"minecraft:golden_chestplate"},{"id":"minecraft:golden_helmet","name":"Golden Helmet","cats":["removed"],"removedRecipes":["minecraft:golden_helmet"],"img":"minecraft:golden_helmet"},{"id":"minecraft:golden_leggings","name":"Golden Leggings","cats":["removed"],"removedRecipes":["minecraft:golden_leggings"],"img":"minecraft:golden_leggings"},{"id":"mechanical:granite_chunk","name":"Granite Rock","cats":["materials"],"note":"Plocka lösa stenar ([[loose_granite]]) på marken: liten 1 st, mellan 2 st, stor (kräver pickaxe) 3–4 st. Vanilla Granite släpper också 2–4 rock chunks i stället för sig själv.\nAlla fyra sorterna räknas som rock chunks och kan blandas: stenhuvuden, [[kiln]], och 4 → 1 Cobblestone. Lagar Crude-verktyg.","img":"mechanical:granite_chunk"},{"id":"minecraft:gray_bed","name":"Gray Bed","cats":["removed"],"removedRecipes":["minecraft:dye_gray_bed","minecraft:gray_bed"],"img":"minecraft:gray_bed"},{"id":"minecraft:green_bed","name":"Green Bed","cats":["removed"],"removedRecipes":["minecraft:dye_green_bed","minecraft:green_bed"],"img":"minecraft:green_bed"},{"id":"mechanical:horn","name":"Horn","cats":["wildlife"],"note":"Styckning av Aurochs (50 %) och Mouflon (30 %). Material för senare recept.","img":"mechanical:horn"},{"id":"minecraft:iron_axe","name":"Iron Axe","cats":["removed"],"removedRecipes":["minecraft:iron_axe"],"img":"minecraft:iron_axe"},{"id":"minecraft:iron_boots","name":"Iron Boots","cats":["removed"],"removedRecipes":["minecraft:iron_boots"],"img":"minecraft:iron_boots"},{"id":"minecraft:iron_chestplate","name":"Iron Chestplate","cats":["removed"],"removedRecipes":["minecraft:iron_chestplate"],"img":"minecraft:iron_chestplate"},{"id":"minecraft:iron_helmet","name":"Iron Helmet","cats":["removed"],"removedRecipes":["minecraft:iron_helmet"],"img":"minecraft:iron_helmet"},{"id":"minecraft:iron_hoe","name":"Iron Hoe","cats":["removed"],"removedRecipes":["minecraft:iron_hoe"],"img":"minecraft:iron_hoe"},{"id":"mechanical:iron_knife","name":"Iron Knife","cats":["tools"],"note":"Järnåldern, **går inte att få tag på än** (finns i creative). 2× snabbare och 1,5× mer utbyte vid styckning än Flint Knife. Kan stycka Brown Bear (liksom Tusk Dagger). Fungerar i alla knivrecept.","img":"mechanical:iron_knife"},{"id":"minecraft:iron_leggings","name":"Iron Leggings","cats":["removed"],"removedRecipes":["minecraft:iron_leggings"],"img":"minecraft:iron_leggings"},{"id":"minecraft:iron_pickaxe","name":"Iron Pickaxe","cats":["removed"],"removedRecipes":["minecraft:iron_pickaxe"],"img":"minecraft:iron_pickaxe"},{"id":"minecraft:iron_shovel","name":"Iron Shovel","cats":["removed"],"removedRecipes":["minecraft:iron_shovel"],"img":"minecraft:iron_shovel"},{"id":"minecraft:iron_spear","name":"Iron Spear","cats":["removed"],"removedRecipes":["minecraft:iron_spear"],"img":"minecraft:iron_spear"},{"id":"minecraft:iron_sword","name":"Iron Sword","cats":["removed"],"removedRecipes":["minecraft:iron_sword"],"img":"minecraft:iron_sword"},{"id":"mechanical:jungle_firewood","name":"Jungle Firewood","cats":["materials"],"note":"Alla Jungle-logs (även stripped och wood-block) släpper **2 Jungle Firewood** i stället för sig själva. Fällda träd ger Firewood via [[jungle_fallen_log]] → [[jungle_rough_log]] → hugg på en stubbe (2–3 st).\nBygger [[minecraft:campfire]], bränsle i Clay Kiln (1 min), 2 st → Charcoal i Clay Kiln, och 4 av samma sort → 1 Jungle Log. Högerklicka på glöd för att tända elden igen, eller på en brinnande eld för +1 minut (max 10 min).\nBilden visar 1, 2 eller 3 vedträn beroende på antal.","fuel":60.0,"img":"mechanical:jungle_firewood"},{"id":"minecraft:jungle_log","name":"Jungle Log","cats":["changed"],"note":"**Kräver yxa.** Släpper **2 [[jungle_firewood]]** i stället för sig själv. Hugger man en log i ett naturligt träd fälls hela trädet: stammen blir [[jungle_fallen_log]], löven blir Leaf Litter, och en [[jungle_stump]] blir kvar (smyg för att bara hugga en log). 4 Firewood → 1 Log.","fuel":120.0,"img":"minecraft:jungle_log"},{"id":"minecraft:jungle_planks","name":"Jungle Planks","cats":["changed"],"fuel":30.0,"img":"minecraft:jungle_planks"},{"id":"minecraft:jungle_sapling","name":"Jungle Sapling","cats":["vanilla"],"fuel":10.0,"img":"minecraft:jungle_sapling"},{"id":"mechanical:jungle_stump","name":"Jungle Stump","cats":["blocks"],"note":"Blir kvar där man högg när ett Jungle-träd fälls. Har inget item. Ger 1–2 Sticks, bryts snabbast med yxa.\nFungerar som **huggkubbe**: högerklicka en [[jungle_rough_log]] på stubben och hugg den till Firewood.","img":"mechanical:jungle_stump"},{"id":"minecraft:jungle_wood","name":"Jungle Wood","cats":["vanilla"],"fuel":120.0,"img":"minecraft:jungle_wood"},{"id":"mechanical:lard","name":"Lard","cats":["wildlife"],"note":"Styckning av Wild Boar (50 %, 1–2 st). Laga på Campfire → 1 [[tallow]].","img":"mechanical:lard"},{"id":"minecraft:leaf_litter","name":"Leaf Litter","cats":["changed"],"note":"Blir på marken där löven från ett fällt träd landar. **Tändmaterial:** högerklicka på en släckt Campfire eller Clay Kiln, då lyckas Fire Drill i 75 % av försöken.","img":"minecraft:leaf_litter"},{"id":"minecraft:leather","name":"Leather","cats":["changed"],"note":"Djur släpper inte Leather längre. Torka [[scraped_hide]] på en [[drying_rack]]. Leather Armor isolerar 15 % per del mot kyla.","img":"minecraft:leather"},{"id":"minecraft:leather_boots","name":"Leather Boots","cats":["removed"],"removedRecipes":["minecraft:leather_boots"],"img":"minecraft:leather_boots"},{"id":"minecraft:leather_helmet","name":"Leather Cap","cats":["removed"],"removedRecipes":["minecraft:leather_helmet"],"img":"minecraft:leather_helmet"},{"id":"minecraft:leather_leggings","name":"Leather Pants","cats":["removed"],"removedRecipes":["minecraft:leather_leggings"],"img":"minecraft:leather_leggings"},{"id":"minecraft:leather_chestplate","name":"Leather Tunic","cats":["removed"],"removedRecipes":["minecraft:leather_chestplate"],"img":"minecraft:leather_chestplate"},{"id":"minecraft:oak_leaves","name":"Leaves","cats":["changed"],"note":"Alla löv: chansen för Stick är höjd (~10 %). Löv från fällda träd blir **Leaf Litter** på marken (tändmaterial).","img":"minecraft:oak_leaves"},{"id":"minecraft:light_blue_bed","name":"Light Blue Bed","cats":["removed"],"removedRecipes":["minecraft:dye_light_blue_bed","minecraft:light_blue_bed"],"img":"minecraft:light_blue_bed"},{"id":"minecraft:light_gray_bed","name":"Light Gray Bed","cats":["removed"],"removedRecipes":["minecraft:dye_light_gray_bed","minecraft:light_gray_bed"],"img":"minecraft:light_gray_bed"},{"id":"minecraft:lime_bed","name":"Lime Bed","cats":["removed"],"removedRecipes":["minecraft:dye_lime_bed","minecraft:lime_bed"],"img":"minecraft:lime_bed"},{"id":"mechanical:lingonberries","name":"Lingonberries","cats":["foraging"],"note":"Plockas från en mogen [[lingonberry_bush]] (högerklicka). 1 hunger. Kan inte planteras än. Får plats i [[bark_basket]].","img":"mechanical:lingonberries"},{"id":"mechanical:lingonberry_bush","name":"Lingonberry Bush","cats":["foraging"],"note":"Vild buske i Taiga, Snowy Taiga, Old Growth Pine/Spruce Taiga. Sällsynt, i små grupper. Växer bar → blommor → omogen → mogen (~6 min per steg i ljus).\n**Högerklicka en mogen buske → 1–3 [[lingonberries]]**, sedan börjar den om från blommor. Hugger man sönder den: 1–2 Sticks + 1–2 Plant Fibre, och den är borta. Brown Bear äter gärna mogna bär.","img":"mechanical:lingonberry_bush"},{"id":"mechanical:loose_andesite","name":"Loose Andesite","cats":["blocks"],"note":"Lös sten på marken (3 storlekar), bara på Grass Block och Stone eller Andesite. Liten/mellan: ett slag → 1/2 [[andesite_chunk]]. Stor: kräver pickaxe → 3–4 st. Har inget item.","img":"mechanical:loose_andesite"},{"id":"mechanical:loose_diorite","name":"Loose Diorite","cats":["blocks"],"note":"Lös sten på marken (3 storlekar), bara på Grass Block och Stone eller Diorite. Liten/mellan: ett slag → 1/2 [[diorite_chunk]]. Stor: kräver pickaxe → 3–4 st. Har inget item.","img":"mechanical:loose_diorite"},{"id":"mechanical:loose_flint","name":"Loose Flint","cats":["blocks"],"note":"Lös flinta på marken (3 storlekar). Ger Flint i stället för chunks. Har inget item.","img":"mechanical:loose_flint"},{"id":"mechanical:loose_granite","name":"Loose Granite","cats":["blocks"],"note":"Lös sten på marken (3 storlekar), bara på Grass Block och Stone eller Granite. Liten/mellan: ett slag → 1/2 [[granite_chunk]]. Stor: kräver pickaxe → 3–4 st. Har inget item.","img":"mechanical:loose_granite"},{"id":"mechanical:loose_stone","name":"Loose Stone","cats":["blocks"],"note":"Lös sten på marken (3 storlekar), bara på Grass Block och Stone. Liten/mellan: ett slag → 1/2 [[stone_chunk]]. Stor: kräver pickaxe → 3–4 st. Har inget item.","img":"mechanical:loose_stone"},{"id":"minecraft:magenta_bed","name":"Magenta Bed","cats":["removed"],"removedRecipes":["minecraft:dye_magenta_bed","minecraft:magenta_bed"],"img":"minecraft:magenta_bed"},{"id":"mechanical:mangrove_firewood","name":"Mangrove Firewood","cats":["materials"],"note":"Alla Mangrove-logs (även stripped och wood-block) släpper **2 Mangrove Firewood** i stället för sig själva. Fällda träd ger Firewood via [[mangrove_fallen_log]] → [[mangrove_rough_log]] → hugg på en stubbe (2–3 st).\nBygger [[minecraft:campfire]], bränsle i Clay Kiln (1 min), 2 st → Charcoal i Clay Kiln, och 4 av samma sort → 1 Mangrove Log. Högerklicka på glöd för att tända elden igen, eller på en brinnande eld för +1 minut (max 10 min).\nBilden visar 1, 2 eller 3 vedträn beroende på antal.","fuel":60.0,"img":"mechanical:mangrove_firewood"},{"id":"minecraft:mangrove_log","name":"Mangrove Log","cats":["changed"],"note":"**Kräver yxa.** Släpper **2 [[mangrove_firewood]]** i stället för sig själv. Hugger man en log i ett naturligt träd fälls hela trädet: stammen blir [[mangrove_fallen_log]], löven blir Leaf Litter, och en [[mangrove_stump]] blir kvar (smyg för att bara hugga en log). 4 Firewood → 1 Log.","fuel":120.0,"img":"minecraft:mangrove_log"},{"id":"minecraft:mangrove_planks","name":"Mangrove Planks","cats":["changed"],"fuel":30.0,"img":"minecraft:mangrove_planks"},{"id":"minecraft:mangrove_propagule","name":"Mangrove Propagule","cats":["vanilla"],"fuel":10.0,"img":"minecraft:mangrove_propagule"},{"id":"mechanical:mangrove_stump","name":"Mangrove Stump","cats":["blocks"],"note":"Blir kvar där man högg när ett Mangrove-träd fälls. Har inget item. Ger 1–2 Sticks, bryts snabbast med yxa.\nFungerar som **huggkubbe**: högerklicka en [[mangrove_rough_log]] på stubben och hugg den till Firewood.","img":"mechanical:mangrove_stump"},{"id":"minecraft:mangrove_wood","name":"Mangrove Wood","cats":["vanilla"],"fuel":120.0,"img":"minecraft:mangrove_wood"},{"id":"mechanical:morel","name":"Morel","cats":["foraging"],"note":"Växer i Forest, Flower Forest, Birch Forest. **Högerklicka (eller bryt) för att plocka.** Sprider sig långsamt i skugga (ljus ≤ 12) om det finns färre än 4 av samma sort runt omkring. Rå: 1 hunger. Ätlig: kan rostas till [[roasted_mushrooms]]. Kan inte planteras än. Släpper alltid med kniv, hälften av gångerna utan.","img":"mechanical:morel"},{"id":"mechanical:mutton_scraps","name":"Mutton Scraps","cats":["food"],"note":"Andra omgången när man styckar en Carcass med kniv: Sheep, Mouflon. 1 hunger.\nLaga på en Campfire (20 s) → [[cooked_mutton_scraps]]. Ta av den i tid, annars blir den [[burnt_food]].","img":"mechanical:mutton_scraps"},{"id":"mechanical:oak_firewood","name":"Oak Firewood","cats":["materials"],"note":"Alla Oak-logs (även stripped och wood-block) släpper **2 Oak Firewood** i stället för sig själva. Fällda träd ger Firewood via [[oak_fallen_log]] → [[oak_rough_log]] → hugg på en stubbe (2–3 st).\nBygger [[minecraft:campfire]], bränsle i Clay Kiln (1 min), 2 st → Charcoal i Clay Kiln, och 4 av samma sort → 1 Oak Log. Högerklicka på glöd för att tända elden igen, eller på en brinnande eld för +1 minut (max 10 min).\nBilden visar 1, 2 eller 3 vedträn beroende på antal.","fuel":60.0,"img":"mechanical:oak_firewood"},{"id":"minecraft:oak_log","name":"Oak Log","cats":["changed"],"note":"**Kräver yxa.** Släpper **2 [[oak_firewood]]** i stället för sig själv. Hugger man en log i ett naturligt träd fälls hela trädet: stammen blir [[oak_fallen_log]], löven blir Leaf Litter, och en [[oak_stump]] blir kvar (smyg för att bara h ":"Raw Hide","cats":["wildlife"],"note":"Första omgången vid styckning (Cow 30 %, Pig 25 %, stora djur 40–70 %; Sheep och Mouflon i andra omgången). Djur släpper inte Leather längre.\nRaw Hide + kniv → [[scraped_hide]].","img":"mechanical:raw_hide"},{"id":"minecraft:salmon","name":"Raw Salmon","cats":["vanilla"],"img":"minecraft:salmon"},{"id":"minecraft:red_bed","name":"Red Bed","cats":["removed"],"removedRecipes":["minecraft:dye_red_bed","minecraft:red_bed"],"img":"minecraft:red_bed"},{"id":"mechanical:roasted_mushrooms","name":"Roasted Mushrooms","cats":["food"],"note":"Valfri ätlig svamp (även vanilla Brown Mushroom) på en Campfire (20 s). 4 hunger.","img":"mechanical:roasted_mushrooms"},{"id":"mechanical:stone_chunk","name":"Rock","cats":["materials"],"note":"Plocka lösa stenar ([[loose_stone]]) på marken: liten 1 st, mellan 2 st, stor (kräver pickaxe) 3–4 st. Vanilla Stone släpper också 2–4 rock chunks i stället för sig själv.\nAlla fyra sorterna räknas som rock chunks och kan blandas: stenhuvuden, [[kiln]], och 4 → 1 Cobblestone. Lagar Crude-verktyg.","img":"mechanical:stone_chunk"},{"id":"mechanical:acacia_rough_log","name":"Rough Acacia Log","cats":["materials"],"note":"Sista steget när man bearbetar en [[acacia_fallen_log]] med yxa (om det lyckas, annars 2–3 Sticks). Stackar 16.\n**Högerklicka på en [[acacia_stump]]** för att ställa den på stubben (tom hand tar tillbaka den). **Håll in högerklick med yxa** på den: lyckas → 2–3 [[acacia_firewood]] (+1 med Stone Axe, +2 Iron Axe, +3 Diamond Axe), misslyckas → 1 Firewood + 1–2 Sticks. Chans: Flint Axe 60 %, Crude Stone Axe 65 %, Stone Axe 75 %, Iron Axe 95 %.","img":"mechanical:acacia_rough_log"},{"id":"mechanical:birch_rough_log","name":"Rough Birch Log","cats":["materials"],"note":"Sista steget när man bearbetar en [[birch_fallen_log]] med yxa (om det lyckas, annars 2–3 Sticks). Stackar 16.\n**Högerklicka på en [[birch_stump]]** för att ställa den på stubben (tom hand tar tillbaka den). **Håll in högerklick const byId=Object.fromEntries(D.items.map(i=>[i.id,i]));
const catName=Object.fromEntries(D.cats);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const nm=id=>(byId[id]&&byId[id].name)||id.split(":")[1].replace(/_/g," ");
const pic=(id,cls="")=>{const k=(byId[id]&&byId[id].img)||(D.images[id]?id:null);return k?`<img src="${D.images[k]}" alt="" class="${cls}" loading="lazy">`:`<span class="ph ${cls}">${esc(nm(id)[0]||"?")}</span>`};
const allIngs=r=>(r.ings||[]).concat((r.grid||[]).flat().filter(Boolean));
const makes={},uses={};
D.recipes.forEach((r,i)=>{(makes[r.result.id]??=[]).push(i);new Set(allIngs(r).flatMap(g=>g.opts)).forEach(id=>(uses[id]??=[]).push(i))});
let cat="all",sel=null;
const chips=document.getElementById("chips"),grid=document.getElementById("grid"),q=document.getElementById("q"),det=document.getElementById("detail"),main=document.getElementById("main");
const inAll=i=>!i.cats.every(x=>x==="vanilla"||x==="removed");
const count=c=>D.items.filter(i=>c==="all"?inAll(i):i.cats.includes(c)).length;
function drawChips(){chips.innerHTML=[["all","Alla"],...D.cats].filter(([c])=>count(c)).map(([c,n])=>`<button class="chip" data-c="${c}" aria-pressed="${c===cat}">${esc(n)}<small>${count(c)}</small></button>`).join("")}
chips.onclick=e=>{const b=e.target.closest(".chip");if(b){cat=b.dataset.c;drawChips();drawGrid()}};
function drawGrid(){
  const s=q.value.trim().toLowerCase();
  const list=D.items.filter(i=>(cat==="all"?(s||inAll(i)):i.cats.includes(cat))&&(!s||i.name.toLowerCase().includes(s)||i.id.includes(s)));
  grid.innerHTML=list.length?list.map(i=>`<a class="card${i.id===sel?" sel":""}" href="#${i.id}">${pic(i.id)}<span>${esc(i.name)}</span></a>`).join(""):`<p class="empty">Inget hittades.</p>`;
}
q.oninput=drawGrid;
function slot(g,cls=""){
  if(!g)return `<span class="slot ${cls}"></span>`;
  const id=g.opts[0],alt=g.opts.length>1?" (eller "+g.opts.slice(1,6).map(nm).join(", ")+(g.opts.length>6?" …":"")+")":"";
  return `<a class="slot ${cls}${g.tag?" tagged":""}" href="#${id}" title="${esc((g.tag?g.tag+": ":"")+nm(id)+alt)}">${pic(id)}${g.count>1?`<i>${g.count}</i>`:""}</a>`;
}
const out=r=>`<span class="arrow">→</span>${slot({opts:[r.result.id],count:r.result.count},"out")}`;
function recipe(r){
  let body;
  if(r.kind==="grid")body=`<div class="g3">${r.grid.flat().map(g=>slot(g)).join("")}</div>`;
  else if(r.kind==="slots")body=`<div class="line">${r.ings.map(g=>`<span class="lab">${slot(g)}${esc(g.label||"")}</span>`).join("")}</div>`;
  else if(r.kind==="cook")body=`<div class="line">${r.ings.map(g=>slot(g)).join("")}</div><svg class="fire" viewBox="0 0 16 16" width="22" height="22" aria-label="värme"><path d="M8 1c1 3 4 4.5 4 8.5A4 4 0 0 1 4 9.5C4 7 5.5 6 6 4c.8 1.2 1 2 1 3 1-1.5 1.3-3.5 1-6z" fill="#e8772e"/></svg>`;
  else body=`<div class="line">${r.ings.map(g=>slot(g)).join("")}</div>`;
  const t=r.time?`${r.time>=60?(r.time/60).toFixed(r.time%60?1:0)+" min":r.time+" s"}`:"";
  return `<div class="rec"><div class="st"><b>${esc(r.station)}</b><span>${[r.kind==="list"?"formlöst":"",t].filter(Boolean).join(" · ")}</span></div><div class="row">${body}${out(r)}</div></div>`;
}
function noteHtml(t){
  return t.split(/\n\s*\n|\n/).map(p=>"<p>"+esc(p).replace(/\[\[([a-z0-9_:]+)\]\]/g,(m,id)=>{id=id.includes(":")?id:"mechanical:"+id;return `<a href="#${id}">${esc(nm(id))}</a>`}).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>")+"</p>").join("");
}
const fmtT=s=>s>=60?(s/60).toFixed(s%60?1:0)+" min":s+" s";
function show(id){
  sel=id;const i=byId[id];
  if(!i){det.innerHTML="";main.classList.remove("open");drawGrid();return}
  const mk=makes[id]||[],us=[...new Set(uses[id]||[])];
  let h=`<div class="dh">${pic(id)}<div><h2>${esc(i.name)}</h2><div class="id">${esc(id)}</div><div class="tags">${i.cats.map(c=>`<span class="tag">${esc(catName[c]||c)}</span>`).join("")}</div></div><button id="close" aria-label="Stäng">×</button></div>`;
  if(i.note)h+=`<h3>Beskrivning</h3><div class="note">${noteHtml(i.note)}</div>`;
  if(i.removedRecipes)h+=`<h3>Borttaget från vanilla</h3><p class="muted">Vanilla-receptet är borttaget (${i.removedRecipes.map(esc).join(", ")}).</p>`;
  if(i.fuel)h+=`<h3>Bränsle</h3><p class="muted">Brinner i ${fmtT(i.fuel)} i en <a href="#mechanical:kiln">Clay Kiln</a>.</p>`;
  if(id==="mechanical:kiln"&&D.fuels.length)h+=`<h3>Bränsle i Clay Kiln</h3><table>${D.fuels.map(f=>`<tr><td><a href="#${f.ing.opts[0]}">${pic(f.ing.opts[0])}${esc((f.ing.refs||[f.ing.opts[0]]).map(r=>r[0]==="#"?r:nm(r)).join(", "))}</a></td><td>${f.time?fmtT(f.time):""}</td></tr>`).join("")}</table>`;
  h+=`<h3>Så tillverkas det</h3>`+(mk.length?mk.map(n=>recipe(D.recipes[n])).join(""):`<p class="muted">Inget recept.</p>`);
  if(us.length){
    const res=[...new Set(us.map(n=>D.recipes[n].result.id))];
    h+=`<h3>Används i</h3><div class="uses">${res.map(r=>`<a class="use" href="#${r}">${pic(r)}${esc(nm(r))}</a>`).join("")}</div>`;
    h+=`<details><summary class="muted" style="cursor:pointer;margin-top:10px">Visa recepten (${us.length})</summary><div style="margin-top:10px">${us.map(n=>recipe(D.recipes[n])).join("")}</div></details>`;
  }
  det.innerHTML=h;det.scrollTop=0;main.classList.add("open");
  document.getElementById("close").onclick=()=>{history.pushState("",document.title,location.pathname+location.search);show(null)};
  drawGrid();
}
const route=()=>show(decodeURIComponent(location.hash.slice(1))||null);
addEventListener("hashchange",route);
addEventListener("keydown",e=>{if(e.key==="Escape"&&sel)document.getElementById("close").click();if(e.key==="/"&&document.activeElement!==q){e.preventDefault();q.focus()}});
drawChips();route();if(!sel)drawGrid();
</script>
</body>
</html>
